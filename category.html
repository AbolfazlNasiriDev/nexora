<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <script src="https://cdn.tailwindcss.com"></script>

<body data-page="category">
  <div id="site-header"></div>

  <main class="shell py-4 md:py-6">
    <nav id="breadcrumb" class="text-[11px] text-muted mb-3 flex items-center gap-1.5 flex-wrap"></nav>

    <section id="category-hero" class="mb-4"></section>

    <div class="grid lg:grid-cols-[270px_minmax(0,1fr)] gap-4 items-start">
      <aside class="hidden lg:block card p-4 sticky top-28" id="filters-desktop">
        <div id="filters-root-desktop"></div>
      </aside>

      <section class="min-w-0">
        <div class="card p-3 mb-3" id="listing-toolbar"></div>
        <div class="flex flex-wrap gap-2 mb-3" id="active-filters"></div>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-2.5 md:gap-3" id="listing-grid"></div>
        <div class="mt-6" id="listing-pagination"></div>

    </div>

  <div id="site-footer"></div>

  <div class="fixed inset-0 bg-ink/50 backdrop-blur-sm z-[85] hidden" id="filters-overlay"></div>
  <aside class="filter-panel lg:hidden" id="filters-mobile" aria-label="فیلتر محصولات">

      <div class="text-sm font-extrabold text-ink flex items-center gap-2"><i data-lucide="sliders-horizontal" class="w-4 h-4 text-primary"></i> فیلترها</div>

    </div>
    <div class="p-4" id="filters-root-mobile"></div>

  <script src="js/categories.js"></script>

  <script src="js/products.js"></script>
